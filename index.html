	<style type="text/css">
		html{ background-color: #b8956a; }
		body, html{ padding: 0; margin: 0; overflow: hidden; font-family: Arial; -webkit-tap-highlight-color: transparent; touch-action: pan-x pan-y; overscroll-behavior: none; width: 100%; height: 100%; height: 100dvh; position: fixed; inset: 0; }
		body{ background-color: #b8956a; background-image: url(background.svg); background-size: cover; background-position: center center; overflow: hidden; }

		#boot-overlay{ position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); background-color: #b8956a; background-image: url(background.svg); background-size: cover; background-position: center center; transition: opacity 0.4s ease; overflow-x: hidden; overflow-y: auto; touch-action: manipulation; pointer-events: none; }

		#boot-overlay.boot-ready{ pointer-events: auto; cursor: pointer; }
		#boot-overlay.boot-hidden{ opacity: 0; pointer-events: none; }

		#boot-clouds{ position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
		.boot-cloud{ position: absolute; top: var(--y, 8%); left: 0; width: calc(127px * var(--s, 1)); height: auto; opacity: var(--o, 0.78); filter: drop-shadow(0 2px 0 rgba(186, 140, 110, 0.18)); animation: boot-cloud-drift var(--dur, 50s) linear infinite; animation-delay: var(--delay, 0s); transform: translate3d(-35vw, 0, 0) scaleX(var(--fx, 1)); }

		@keyframes boot-cloud-drift{ from{ transform: translate3d(-35vw, 0, 0) scaleX(var(--fx, 1)); } to{ transform: translate3d(110vw, 0, 0) scaleX(var(--fx, 1)); } }

		@media (prefers-reduced-motion: reduce){ .boot-cloud{ animation: none; transform: translate3d(var(--rest-x, 10vw), 0, 0) scaleX(var(--fx, 1)); } }

		#boot-loading{ position: relative; z-index: 1; text-align: center; padding: 8px 16px 0; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 420px; margin: 0 auto; flex-shrink: 0; }
		#loading{ color: #111; font-weight: 800; font-size: clamp(20px, 5.2vw, 28px); text-align: center; line-height: 1.2; letter-spacing: -0.02em; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35); }
		#loading-hint{ color: rgba(0, 0, 0, 0.58); font-size: clamp(12px, 3.4vw, 15px); font-weight: 600; margin: 8px 0 0; min-height: 1.25em; line-height: 1.35; padding: 0 4px; }
		#boot-banner-wrap{ position: relative; width: min(394px, 92vw); aspect-ratio: 197 / 16; height: auto; margin: 16px auto 0; overflow: hidden; border-radius: 2px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); }
		#boot-banner{ display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; }
		#loadbar{ position: absolute; top: 0; left: 0; width: calc(100% * 13.95 / 197); height: 100%; background: linear-gradient(to bottom, #0082F5 0%, #0053C6 100%); transform: scaleX(0); transform-origin: left center; pointer-events: none; }

		#boot-whatsnew{ position: relative; z-index: 1; width: min(420px, 92vw); max-width: 100%; margin: 20px auto 12px; padding: 0 8px 8px; text-align: center; pointer-events: none; font-family: Arial, Helvetica, sans-serif; line-height: 1.35; user-select: none; flex-shrink: 0; box-sizing: border-box; }

<body>
	<div id="boot-overlay">
		<div id="boot-clouds" aria-hidden="true"></div>
		<div id="boot-loading">
			<div id="loading">Loading...</div>
			<div id="loading-hint" aria-live="polite"></div>
			<div id="boot-banner-wrap"><img id="boot-banner" src="banner.svg" width="394" height="32" alt="Loading progress" fetchpriority="high" decoding="async"><div id="loadbar" aria-hidden="true"></div></div>
		</div>
		<div id="boot-whatsnew" aria-hidden="true">
			<div class="boot-whatsnew-title">What's new?</div>
			<ul id="boot-whatsnew-list"><li>New items</li><li>Friends System</li><li>Multiplayer Fixes</li></ul>
		</div>
		<div id="boot-focus"><img src="focuswarning.png" width="1173" height="304" alt="Click to focus the game" decoding="async" fetchpriority="low"></div>
	</div>
	<div id="game" class="boot-locked"></div>

	<script>
		// Recreate the cloud generation
		function randBetween(min, max){ return min + Math.random() * (max - min) }
		function spawnBootClouds(){
			var wrap = document.getElementById('boot-clouds')
			if(!wrap) return
			wrap.innerHTML = ''
			var count = 12 + Math.floor(Math.random() * 5)
			var frag = document.createDocumentFragment()
			for(var i = 0; i < count; i++){
				var img = document.createElement('img')
				img.className = 'boot-cloud'
				img.alt = ''
				img.width = 127
				img.height = 53
				img.decoding = 'async'
				var y = randBetween(10, 34)
				var s = randBetween(0.7, 1.85) + 0.7
				var dur = randBetween(36, 72) - (s * 6)
				if(dur < 28) dur = 28
				var delay = -randBetween(0, dur)
				var o = randBetween(0.55, 0.88)
				var fx = Math.random() < 0.5 ? -1 : 1
				img.style.cssText = '--y:' + y.toFixed(1) + '%;--s:' + s.toFixed(2) + ';--dur:' + dur.toFixed(1) + 's;--delay:' + delay.toFixed(1) + 's;--o:' + o.toFixed(2) + ';--fx:' + fx + ';'
				img.src = 'cloud.svg'
				frag.appendChild(img)
			}
			wrap.appendChild(frag)
		}
		spawnBootClouds()

		// Load main logic
		document.addEventListener('DOMContentLoaded', () => {
			if(typeof window.RufflePlayer?.newest !== 'function'){
				document.getElementById('loading').textContent = 'Could not load game player'
				return
			}

			const loadingEl = document.getElementById('loading')
			const hintEl = document.getElementById('loading-hint')
			const loadbarEl = document.getElementById('loadbar')
			const bootOverlay = document.getElementById('boot-overlay')
			const focusEl = document.getElementById('boot-focus')
			const gameContainer = document.getElementById('game')

			let bootPcent = 0
			let gameReady = false
			let bootDismissed = false

			function setBootProgress(pct){
				bootPcent = Math.max(0, Math.min(100, pct))
				loadbarEl.style.transform = 'scaleX(' + (bootPcent / 100 * (197 / 13.95)) + ')'
			}

			function onGameReady(){
				if(gameReady) return
				gameReady = true
				bootPcent = 100
				loadbarEl.style.transform = 'scaleX(' + (197 / 13.95) + ')'
				loadingEl.textContent = 'Ready!'
				hintEl.textContent = 'Tap anywhere to start playing'
				// Show focus overlay
				document.getElementById('boot-loading').style.display = 'none'
				document.getElementById('boot-whatsnew').style.display = 'none'
				document.getElementById('boot-clouds').style.display = 'none'
				focusEl.style.display = 'flex'
				bootOverlay.classList.add('boot-ready')
				
				// Wait for click/tap to start
				bootOverlay.addEventListener('click', function startGame(){
					bootDismissed = true
					focusEl.style.display = 'none'
					bootOverlay.classList.remove('boot-ready')
					bootOverlay.classList.add('boot-hidden')
					gameContainer.classList.remove('boot-locked')
					try{ player.play() }catch(e){}
					try{ player.ruffle().resume() }catch(e){}
					bootOverlay.remove()
				}, { once: true })
			}

			// Define stickrun frame2 callback (called by your SWF)
			window.stickrun_frame2 = function(){ onGameReady() }

			// Create Ruffle player
			const ruffle = window.RufflePlayer.newest()
			const player = ruffle.createPlayer()
			window.player = player
			player.style.opacity = '0'
			gameContainer.appendChild(player)

			setBootProgress(18)
			hintEl.textContent = 'Preparing game client'

			// Load the SWF
			player.ruffle().load({
				url: 'stickrun.swf',
				autoplay: 'on',
				unmuteOverlay: 'hidden',
				letterbox: 'off',
				splashScreen: false,
				contextMenu: 'off',
				menu: false,
				showSwfDownload: false,
				allowScriptAccess: true,
				quality: 'medium',
				base: '/',
				parameters: { ruffle: true }
			}).then(() => {
				// This falls back if SWF doesn't call frame2 quickly
				player.style.opacity = '1'
				setTimeout(() => {
					if(!gameReady) onGameReady()
				}, 5000)
			}).catch(err => {
				loadingEl.textContent = 'Failed to load game'
				hintEl.textContent = 'Check your connection and refresh'
				console.error(err)
			})

			// Simulate loading progress
			setInterval(() => {
				if(!gameReady && bootPcent < 90){
					setBootProgress(bootPcent + Math.random() * 3)
				}
			}, 200)
		})
	</script>
